<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена · Page not found</title>
<meta name="description" content="Страница не найдена. Page not found.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F13" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/pitchme/assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="/pitchme/assets/favicon-32.png" type="image/png" sizes="32x32">
<style>
@font-face{font-family:"Onest";src:url("/pitchme/assets/fonts/onest.ttf") format("truetype");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("/pitchme/assets/fonts/jetbrains_mono.ttf") format("truetype");font-weight:400 500;font-style:normal;font-display:swap}
:root{
  color-scheme:light dark;
  --canvas:#F7F7F5;--surface:#FFFFFF;--sunken:#EEEEEA;--ink:#15171C;--ink2:#5A5F6B;--rule:#DEDDD8;--rule-strong:#7F8490;
  --primary:#4F55E3;--spark:#B93E0B;--verified:#0F766E;--warning:#A64B07;--stage:#000000;
  --ignition:linear-gradient(90deg,#6A4CF0,#3E63E6);--glow:linear-gradient(135deg,#937FFC,#6E93FB);
  --e1:0 1px 3px rgba(21,23,28,.06);--e2:0 8px 24px rgba(21,23,28,.12);--card-edge:1px solid var(--rule);
  --r-xs:4px;--r-sm:8px;--r-md:14px;--r-lg:22px;
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--canvas:#0E0F13;--surface:#17191F;--sunken:#0A0B0E;--ink:#ECECEF;--ink2:#B0B4BD;--rule:#2A2D34;--rule-strong:#6B7080;
    --primary:#8F94FF;--spark:#FF8A4C;--verified:#2DD4BF;--warning:#F2B33D;--e1:none;--e2:inset 0 1px 0 #2A2D34;--card-edge:1px solid transparent}
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;
  font-variant-ligatures:no-contextual;font-synthesis:none;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
img,svg{display:block;max-width:100%}
a{color:var(--primary);text-underline-offset:.18em;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:var(--r-xs)}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:clamp(2rem,1.3rem + 3.4vw,3.4rem);letter-spacing:-.02em}
h2{font-size:clamp(1.5rem,1.2rem + 1.4vw,2.1rem)}
h3{font-size:1.15rem;letter-spacing:-.01em;font-weight:600}
p{margin:0 0 1em}
ul,ol{margin:0 0 1em;padding-left:1.25em}
li+li{margin-top:.35em}
.wrap{width:100%;max-width:72rem;margin:0 auto;padding-inline:16px}
@media (min-width:600px){.wrap{padding-inline:24px}}
.narrow{max-width:46rem}
.skip{position:absolute;left:-9999px;top:0}
.skip:focus{left:16px;top:8px;z-index:10;background:var(--surface);padding:.5em 1em;border-radius:var(--r-sm);box-shadow:var(--e2)}
.mono,.meta{font-family:var(--mono);font-size:.82rem;letter-spacing:0;color:var(--ink2)}
.muted{color:var(--ink2)}
.small{font-size:.9rem}
/* header */
.site-head{border-bottom:1px solid var(--rule);background:var(--canvas)}
.site-head .wrap{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;margin-right:auto}
.brand img{width:32px;height:32px;border-radius:7px}
.wm{height:26px;width:auto;color:var(--ink)}
.wm .dot{fill:var(--spark)}
.nav{display:flex;gap:4px 18px;flex-wrap:wrap;align-items:center;font-size:.95rem}
.nav a{color:var(--ink);text-decoration:none;padding:6px 0}
.nav a:hover{color:var(--primary)}
.nav .hide-s{display:none}
@media (min-width:760px){.nav .hide-s{display:inline}}
.lang{font-size:.9rem;color:var(--ink2)}
.lang strong{color:var(--ink);font-weight:600}
.lang a{font-weight:500}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:48px;padding:0 1.5em;border-radius:9999px;
  font:600 1rem/1 var(--sans);text-decoration:none;border:0;cursor:pointer}
.btn-ignition{background:#5458EB;background:var(--ignition);color:#FFFFFF}
.btn-ignition:hover{filter:brightness(1.06);text-decoration:none}
.btn-text{color:var(--primary);padding-inline:.75em}
/* cards and wells */
.card{background:var(--surface);border:var(--card-edge);box-shadow:var(--e1);border-radius:var(--r-md);padding:20px}
.well{background:var(--sunken);border-radius:var(--r-sm);padding:12px 14px}
@media (prefers-color-scheme:dark){.card .well{background:#1E2129}}
section{padding-block:clamp(40px,6vw,72px)}
section+section{border-top:1px solid var(--rule)}
.eyebrow{font-family:var(--mono);font-size:.8rem;color:var(--ink2);margin:0 0 .6em;letter-spacing:.02em}
.status{display:inline-flex;align-items:center;gap:.6em;padding:.45em .95em;border-radius:9999px;background:var(--surface);
  border:1px solid var(--rule);font-size:.92rem;font-weight:500;line-height:1.35}
.status::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--spark)}
.note{border-left:3px solid var(--rule-strong);padding:.25em 0 .25em 1em;color:var(--ink2)}
/* tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:.55em .7em;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600}
/* footer */
.site-foot{border-top:1px solid var(--rule);padding-block:32px 40px;font-size:.92rem;color:var(--ink2)}
.site-foot .cols{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:baseline}
.site-foot a{color:var(--ink)}
.site-foot p{margin:.6em 0 0}
@media (max-width:420px){body{font-size:16px}.card{padding:16px}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.nf{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding-block:48px}
.nf .code{font-family:var(--mono);color:var(--spark);margin:0 0 .4em}
.nf ul{list-style:none;padding:0;margin:1.2em 0 0;display:flex;flex-wrap:wrap;gap:8px 20px}
</style>
</head>
<body>
<main class="nf">
  <div class="wrap narrow">
    <p class="code">404</p>
    <h1>Страница не&nbsp;найдена</h1>
    <p class="muted">Возможно, адрес изменился или в&nbsp;нём опечатка.</p>
    <h2 lang="en" style="font-size:1.3rem;margin-top:1.5em">Page not found</h2>
    <p class="muted" lang="en">The address may have changed, or it may contain a typo.</p>
    <ul>
      <li><a href="/pitchme/">Pitch.me</a></li>
      <li><a href="/pitchme/en/" lang="en">Pitch.me in English</a></li>
      <li><a href="/pitchme/privacy/">Политика конфиденциальности</a></li>
      <li><a href="/pitchme/delete-account/">Удаление аккаунта · Account deletion</a></li>
      <li><a href="/">Talero Apps</a></li>
    </ul>
  </div>
</main>
</body>
</html>
